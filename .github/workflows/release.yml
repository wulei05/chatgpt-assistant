name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.3). Leave empty to build HEAD without creating a release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .app (${{ matrix.arch }})
        run: |
          chmod +x build.sh start-daemon.sh start-bar.sh
          ARCH=${{ matrix.arch }} ./build.sh dist app
          lipo -info "dist/ChatGPT Assistant.app/Contents/MacOS/cgpt-daemon"
          lipo -info "dist/ChatGPT Assistant.app/Contents/MacOS/CGPTBar"

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
          fi
          if [[ -z "$VERSION" || "$VERSION" == *"/"* ]]; then
            VERSION="head-$(git rev-parse --short HEAD)"
          fi
          ARCH="${{ matrix.arch }}"
          ARCHIVE="ChatGPT-Assistant-${VERSION}-macos-${ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/ChatGPT Assistant.app" "${ARCHIVE}"
          ls -lh "${ARCHIVE}"
          shasum -a 256 "${ARCHIVE}" | tee "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-assistant-macos-${{ matrix.arch }}
          path: |
            ChatGPT-Assistant-*.zip
            ChatGPT-Assistant-*.zip.sha256

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber
          else
            # First matrix leg may create the release; others upload.
            gh release create "$GITHUB_REF_NAME" \
              "$ARCHIVE" \
              "${ARCHIVE}.sha256" \
              --title "ChatGPT助手 ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag \
              || gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber
          fi
